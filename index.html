<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سارا احمدی | معمار و طراح فضا</title>
<style>:root{--bg:#fff;--text:#111;--muted:#666;--accent:#000;--border:#e5e5e5;--card:#fafafa}[data-theme=dark]{--bg:#0a0a0a;--text:#f5f5f5;--muted:#aaa;--accent:#fff;--border:#222;--card:#111}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Vazirmatn",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}.container{max-width:800px;margin:0 auto;padding:2rem 1.25rem}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem}h1{font-size:2.8rem;font-weight:700;margin-bottom:0.5rem}.projects{display:grid;gap:2rem;margin:3rem 0}.project{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}.project img{width:100%;height:240px;object-fit:cover;background:#ddd}.project-content{padding:1.5rem}button.theme{background:none;border:1px solid var(--border);color:var(--text);padding:0.4rem 0.8rem;border-radius:6px;cursor:pointer}</style>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
<div class="container">
<header><div>سارا احمدی</div><button class="theme" onclick="toggleTheme()">تم</button></header>
<h1>معمار و طراح فضا</h1>
<p style="color:var(--muted);font-size:1.2rem;margin-bottom:2rem">طراحی فضاهای مسکونی و تجاری با رویکرد مینیمال و فرهنگ ایرانی.</p>
<div class="projects">
<div class="project"><div style="height:240px;background:linear-gradient(45deg,#333,#666)"></div><div class="project-content"><h3>ویلا مودرن تهران</h3><p>طراحی مسکونی با نور طبیعی و مصالح محلی.</p></div></div>
<div class="project"><div style="height:240px;background:linear-gradient(45deg,#111,#444)"></div><div class="project-content"><h3>دفتر کار مینیمال</h3><p>فضای کاری با روح مینیمال مونو.</p></div></div>
</div>
</div>
<script>function toggleTheme(){const h=document.documentElement;const c=h.getAttribute('data-theme')||'light';h.setAttribute('data-theme',c==='light'?'dark':'light');localStorage.setItem('theme',h.getAttribute('data-theme'));}if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');</script>
</body></html>
